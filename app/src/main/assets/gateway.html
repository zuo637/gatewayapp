<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 网关管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #1a1a1a; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #6200EE; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #6200EE; color: white; }
        .btn-primary:disabled { background: #ccc; }
        .btn-danger { background: #fff; color: #D32F2F; border: 1px solid #D32F2F; }
        .status { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .status.running { background: #E8F5E9; color: #2E7D32; }
        .status.stopped { background: #FFEBEE; color: #C62828; }
        .log-entry { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 12px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .log-time { color: #999; }
        .log-method { color: #6200EE; font-weight: bold; }
        .log-status.ok { color: #2E7D32; }
        .log-status.err { color: #C62828; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-title">API 网关状态</div>
            <div id="status" class="status stopped">服务未运行</div>
            <button id="btnStart" class="btn btn-primary" onclick="startGateway()">启动网关</button>
            <button id="btnStop" class="btn btn-danger" style="margin-top:8px;display:none" onclick="stopGateway()">停止网关</button>
        </div>

        <div class="card">
            <div class="card-title">配置</div>
            <div class="form-group">
                <label>监听端口</label>
                <input type="number" id="configPort" value="8128" min="1" max="65535">
            </div>
            <div class="form-group">
                <label>主密钥</label>
                <input type="text" id="configMasterKey" value="gateway-master-2024">
            </div>
            <div class="form-group">
                <label>上游服务（每行一个，支持多个轮询）</label>
                <textarea id="configUpstreams" rows="3" placeholder="http://api1.example.com&#10;http://api2.example.com"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        </div>

        <div class="card">
            <div class="card-title">请求日志</div>
            <button class="btn" style="background:#eee;color:#333;margin-bottom:12px" onclick="loadLogs()">刷新日志</button>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        const bridge = window.AndroidBridge;

        function updateStatusUI(running) {
            const status = document.getElementById('status');
            const btnStart = document.getElementById('btnStart');
            const btnStop = document.getElementById('btnStop');
            if (running) {
                status.textContent = '服务运行中 · 端口 ' + document.getElementById('configPort').value;
                status.className = 'status running';
                btnStart.style.display = 'none';
                btnStop.style.display = 'block';
            } else {
                status.textContent = '服务未运行';
                status.className = 'status stopped';
                btnStart.style.display = 'block';
                btnStop.style.display = 'none';
            }
        }

        function startGateway() {
            bridge.startGateway();
            setTimeout(loadStatus, 500);
        }

        function stopGateway() {
            bridge.stopGateway();
            setTimeout(loadStatus, 500);
        }

        function loadStatus() {
            try {
                const res = JSON.parse(bridge.getStatus());
                updateStatusUI(res.running);
            } catch (e) {
                console.error(e);
            }
        }

        function saveConfig() {
            const config = {
                port: parseInt(document.getElementById('configPort').value) || 8128,
                master_key: document.getElementById('configMasterKey').value || 'gateway-master-2024',
                upstreams: document.getElementById('configUpstreams').value.split('\n').map(s => s.trim()).filter(s => s)
            };
            bridge.saveConfig(JSON.stringify(config));
            alert('配置已保存，重启服务生效');
        }

        function loadLogs() {
            try {
                const logs = JSON.parse(bridge.getLogs());
                const container = document.getElementById('logs');
                if (!logs.length) {
                    container.innerHTML = '<div style="color:#999;text-align:center;padding:20px">暂无日志</div>';
                    return;
                }
                container.innerHTML = logs.slice(-50).reverse().map(l => `
                    <div class="log-entry">
                        <span class="log-time">${l.time}</span>
                        <span class="log-method">${l.method}</span>
                        ${l.path}
                        <span class="log-status ${l.status >= 400 ? 'err' : 'ok'}">${l.status}</span>
                        ${l.ip}
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }

        // 初始加载
        loadStatus();
        loadLogs();
    </script>
</body>
</html>
